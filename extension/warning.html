<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BB-Extension Module1 — Site Blocked</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0b0f19;
      color: #e8eaf2;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .card {
      width: min(640px, 92vw);
      padding: 40px;
      border-radius: 16px;
      background: #141a2b;
      border: 1px solid #2a334d;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }
    .icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: #4c1d1d;
      border: 1px solid #7f1d1d;
      color: #ffc4c4;
      display: grid;
      place-items: center;
      font-size: 20px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.4px;
      color: #ffc4c4;
    }
    .url {
      margin: 14px 0 6px;
      color: #9aa3bd;
      font-size: 13px;
    }
    .url-value {
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      color: #c7cfe5;
    }
    .category {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 600;
      color: #ff9aa2;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #ff6b6b;
    }
    .confidence {
      margin: 6px 0 20px;
      font-size: 13px;
      color: #9aa3bd;
    }
    .bar-track {
      width: 100%; height: 8px;
      background: #232c44;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .bar-fill {
      height: 100%;
      width: var(--conf-w, 0%);
      background: #ff6b6b;
      transition: width 0.6s ease;
    }
    .actions {
      display: flex;
      gap: 12px;
    }
    .btn {
      flex: 1;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    .btn-primary {
      background: #4f46e5;
      color: #fff;
    }
    .btn-primary:hover { background: #4338ca; }
    .btn-secondary {
      background: #1e273b;
      color: #c7cfe5;
      border: 1px solid #3b4661;
    }
    .btn-secondary:hover { background: #27324d; }
    .fine {
      margin-top: 22px;
      font-size: 11px;
      color: #707a9b;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="icon">&#10007;</div>
      <h1>High-threat site blocked</h1>
    </div>
    <div class="url">URL</div>
    <div class="url-value" id="displayUrl">—</div>
    <div class="category">
      <div class="dot" aria-hidden="true"></div>
      <span id="displayCategory">High Threat</span>
    </div>
    <div class="confidence">Confidence: <span id="displayConfidence">0%</span></div>
    <div class="bar-track">
      <div class="bar-fill" id="confBar"></div>
    </div>
    <div class="actions">
      <a class="btn btn-secondary" id="goBack">Go back</a>
      <a class="btn btn-primary" id="visitAnyway">Visit anyway</a>
    </div>
    <p class="fine">
      BB-Extension Module1 analyzed this page with a local XGBoost model and classified
      it as high threat. Proceeding may expose you to phishing or scams.
    </p>
  </div>

  <script src="warning.js"></script>
</body>
</html>
